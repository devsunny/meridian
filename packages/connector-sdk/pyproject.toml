[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "edp-connector-sdk"
version = "0.1.0"
description = "Meridian connector SDK: stable contract for source and sink connectors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Meridian Platform" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/edp_connector_sdk"]
