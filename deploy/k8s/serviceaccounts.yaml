apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-platform
  namespace: meridian
  annotations:
    # Replace with the IRSA role created by `eksctl create iamserviceaccount`.
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT:role/meridian-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-web
  namespace: meridian
automountServiceAccountToken: false
