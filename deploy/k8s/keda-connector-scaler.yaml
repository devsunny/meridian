# KEDA: scale connector workers from zero based on pending work.
# One ScaledObject per connector class; the queue is fed by `orchestrate`.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: edp-aws-irsa
  namespace: edp-jobs
spec:
  podIdentity:
    provider: aws
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connector-box
  namespace: edp-jobs
spec:
  scaleTargetRef:
    name: connector-box
  minReplicaCount: 0          # connectors are bursty; cold start ~25s
  maxReplicaCount: 300
  pollingInterval: 15
  cooldownPeriod: 180
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - { type: Percent, value: 50, periodSeconds: 60 }
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - { type: Percent, value: 100, periodSeconds: 30 }
            - { type: Pods, value: 20, periodSeconds: 30 }
          selectPolicy: Max
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: edp-aws-irsa
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/123456789012/edp-connector-box
        queueLength: "5"          # one pod per 5 pending tasks
        awsRegion: us-east-1
        identityOwner: operator
---
# Doc processors scale on queue depth and message age (oldest message drives scale-up).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: doc-processor
  namespace: edp-jobs
spec:
  scaleTargetRef:
    name: doc-processor
  minReplicaCount: 0
  maxReplicaCount: 100
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: edp-aws-irsa
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/123456789012/edp-document-tasks
        queueLength: "2"
        awsRegion: us-east-1
        identityOwner: operator
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.edp-observability:9090
        metricName: edp_document_oldest_message_age_seconds
        threshold: "120"
        query: max(edp_document_oldest_message_age_seconds{namespace="edp-jobs"})
---
# Temporal workers scale on task-queue backlog rather than CPU.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingest-worker
  namespace: edp-jobs
spec:
  scaleTargetRef:
    name: ingest-worker
  minReplicaCount: 2
  maxReplicaCount: 40
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.edp-observability:9090
        metricName: temporal_task_queue_backlog
        threshold: "50"
        query: sum(temporal_task_queue_backlog{task_queue="ingest-control", namespace="edp-prod"})
