apiVersion: v1
kind: Secret
metadata:
  name: meridian-secrets
  namespace: meridian
type: Opaque
stringData:
  # Replace with AWS Secrets Manager + External Secrets Operator in production.
  MERIDIAN_DATABASE_URL: postgresql+pg8000://meridian:REPLACE_PASSWORD@meridian.cluster-xxxx.us-east-1.rds.amazonaws.com:5432/meridian
  MERIDIAN_JWT_SECRET: REPLACE_WITH_32_PLUS_RANDOM_BYTES
  MERIDIAN_LLM_API_KEY: ""
