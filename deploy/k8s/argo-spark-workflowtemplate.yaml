# Argo WorkflowTemplate generated by `execution-bridge` from a PipelineVersion.
# The WorkflowTemplate is versioned and immutable per pipeline version; runs reference it by name.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: finance-ar-aging-daily-v12
  namespace: edp-jobs
  labels:
    edp.example/tenant: acme
    edp.example/pipeline: finance-ar-aging-daily
    edp.example/version: "12"
spec:
  entrypoint: main
  serviceAccountName: edp-job-acme
  parallelism: 40
  podGC: { strategy: OnPodCompletion }
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 172800
  workflowMetadata:
    labels:
      edp.example/managed-by: orchestrate
      edp.example/tenant: acme
  arguments:
    parameters:
      - { name: run-id, value: "" }
      - { name: data-interval-end, value: "" }
      - { name: tenant, value: acme }
  templates:
    - name: main
      dag:
        tasks:
          - name: silver
            template: dbt
            arguments:
              parameters:
                - { name: selector, value: "tag:ar+" }
          - name: gold
            template: spark
            depends: silver
            arguments:
              parameters:
                - { name: date, value: "{{workflow.parameters.data-interval-end}}" }

    - name: dbt
      inputs:
        parameters:
          - { name: selector }
      retryStrategy:
        limit: 2
        retryPolicy: OnError
        backoff: { duration: "60s", factor: 2, maxDuration: "10m" }
      container:
        image: registry.edp.example/jobs/dbt-trino:1.8.3
        command: ["/bin/sh", "-c"]
        args:
          - >-
            dbt run --select "{{inputs.parameters.selector}}"
            --vars '{"run_id": "{{workflow.parameters.run-id}}"}'
        env:
          - { name: DBT_PROFILES_DIR, value: /etc/dbt }
          - { name: EDP_RUN_ID, value: "{{workflow.parameters.run-id}}" }
          - { name: EDP_TENANT, value: "{{workflow.parameters.tenant}}" }
          - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.edp-observability:4317" }
        volumeMounts:
          - { name: dbt-secrets, mountPath: /etc/dbt/.dbt, readOnly: true }
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "4", memory: 8Gi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }

    # Spark on Kubernetes via the Spark Operator. Argo creates the SparkApplication and
    # waits for a terminal state; the operator owns executor pod lifecycle and autoscaling.
    - name: spark
      inputs:
        parameters:
          - { name: date }
      retryStrategy:
        limit: 1
        retryPolicy: OnFailure
      resource:
        action: create
        successCondition: status.applicationState.state == COMPLETED
        failureCondition: status.applicationState.state == FAILED
        manifest: |
          apiVersion: sparkoperator.k8s.io/v1beta2
          kind: SparkApplication
          metadata:
            name: ar-aging-{{workflow.parameters.run-id}}
            namespace: edp-jobs
            labels:
              edp.example/tenant: acme
              edp.example/run-id: "{{workflow.parameters.run-id}}"
          spec:
            type: Python
            pythonVersion: "3"
            mode: cluster
            image: registry.edp.example/jobs/ar-aging:1.4.2
            imagePullPolicy: IfNotPresent
            mainApplicationFile: s3a://edp-artifacts/acme/jobs/ar_aging.py
            arguments:
              - "--date"
              - "{{inputs.parameters.date}}"
              - "--run-id"
              - "{{workflow.parameters.run-id}}"
            sparkVersion: "3.5.3"
            restartPolicy:
              type: OnFailure
              onFailureRetries: 2
              onFailureRetryInterval: 30
            driver:
              cores: 2
              coreLimit: "3"
              memory: 4g
              serviceAccount: edp-job-acme
              labels: { edp.example/component: spark-driver }
              nodeSelector: { karpenter.sh/capacity-type: spot }
              tolerations:
                - { key: spot, operator: Equal, value: "true", effect: NoSchedule }
              volumeMounts:
                - { name: shuffle, mountPath: /tmp/spark }
            executor:
              cores: 4
              instances: 2
              memory: 8g
              labels: { edp.example/component: spark-executor }
              nodeSelector: { karpenter.sh/capacity-type: spot }
              tolerations:
                - { key: spot, operator: Equal, value: "true", effect: NoSchedule }
              volumeMounts:
                - { name: shuffle, mountPath: /tmp/spark }
            volumes:
              - { name: shuffle, emptyDir: { sizeLimit: 50Gi } }
            dynamicAllocation:
              enabled: true
              minExecutors: 2
              maxExecutors: 40
              initialExecutors: 2
            sparkConf:
              spark.sql.adaptive.enabled: "true"
              spark.sql.adaptive.coalescePartitions.enabled: "true"
              spark.sql.shuffle.partitions: "400"
              spark.kubernetes.executor.disk.type: emptyDir
              spark.eventLog.enabled: "true"
              spark.eventLog.dir: s3a://edp-artifacts/acme/spark-events/
              spark.openlineage.enabled: "true"
              spark.openlineage.transport.type: http
              spark.openlineage.transport.url: http://lineage-collector.edp-system:8080
