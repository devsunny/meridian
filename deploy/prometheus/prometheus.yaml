global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Add service scrape targets here as they are started locally, e.g.:
  # - job_name: edp-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]
