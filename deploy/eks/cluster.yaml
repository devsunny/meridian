apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: meridian
  region: us-east-1
  version: "1.31"
  tags:
    owner: data-platform
    cost-center: analytics

iam:
  withOIDC: true

vpc:
  cidr: 10.20.0.0/16
  nat:
    gateway: Single

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
  - name: aws-efs-csi-driver
    version: latest

managedNodeGroups:
  - name: system
    instanceType: m6i.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    privateNetworking: true
    labels: { role: system }
    tags: { k8s.io/cluster-autoscaler/enabled: "true", k8s.io/cluster-autoscaler/meridian: "owned" }

  - name: platform
    instanceType: m6i.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 10
    privateNetworking: true
    labels: { role: platform }
    tags: { k8s.io/cluster-autoscaler/enabled: "true", k8s.io/cluster-autoscaler/meridian: "owned" }

  - name: batch-spot
    instanceTypes: ["c6i.4xlarge", "c6i.8xlarge", "m6i.4xlarge"]
    spot: true
    desiredCapacity: 0
    minSize: 0
    maxSize: 20
    privateNetworking: true
    labels: { role: batch }
    taints:
      - { key: workload, value: batch, effect: NoSchedule }

# Optional: create the S3 IRSA role with:
#   eksctl create iamserviceaccount \
#     --cluster meridian --region us-east-1 \
#     --namespace meridian --name meridian-platform \
#     --attach-policy-arn arn:aws:iam::ACCOUNT:policy/MeridianLakeAccess \
#     --approve --override-existing-serviceaccounts
